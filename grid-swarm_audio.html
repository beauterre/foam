
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Foam — Audio Visualizer</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080b12;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    #audioButton {
        position: fixed;
        z-index: 10;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 22px;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 30px;
        background: rgba(8,11,18,0.8);
        color: rgba(255,255,255,0.85);
        font: 13px system-ui, sans-serif;
        letter-spacing: 0.08em;
        cursor: pointer;
        backdrop-filter: blur(8px);
    }

    #audioButton:hover {
        background: rgba(50,60,80,0.9);
    }

    #audioButton:disabled {
        cursor: default;
        opacity: 0.6;
    }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<button id="audioButton">♪ Enable audio</button>

<script>

var experience_start=50000000;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const audioButton = document.getElementById("audioButton");

const PARTICLE_COUNT = 8000;
var nrofParticles = 0;
var nrofVoices = 0;
const GRID_SIZE = 70;
const FORCE = 0.07;
const FRICTION = 0.97;
const INDEX_INFLUENCE = 0.00000001;

const COLOR_MIX = 0.02;
const EMPTY_COLOR = { r: 8, g: 11, b: 18 };

// Audio settings.
const AUDIO_VOICE_COUNT = 25;
const AUDIO_VOLUME = 0.03;
const BEAT_MIN = 2;
const BEAT_MAX = 5;

const TAU = Math.PI * 2;

// C-major pentatonic scale, spanning several octaves.
const PENTATONIC = [
    130.81, 146.83, 164.81, 196.00, 220.00,
    261.63, 293.66, 329.63, 392.00, 440.00
];

let cellColors = new Map();
let width = 0;
let height = 0;
let particles = [];

let audioContext = null;
let masterGain = null;
let audioVoices = [];
let audioStarted = false;


// --------------------------------------------------
// CANVAS
// --------------------------------------------------

function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}


// --------------------------------------------------
// PARTICLES
// --------------------------------------------------


    
function createParticles() {
    particles = [];

   const OCEAN_PALETTE = [
        [  8,  35,  64],
        [ 12,  65,  95],
        [ 18,  98, 125],
        [ 20, 135, 151],
        [ 38, 171, 174],
        [ 86, 201, 190],
        [145, 224, 207],
        [199, 241, 225],
        [242, 252, 247],
    ];
    
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        const color = OCEAN_PALETTE[
            Math.floor(Math.random() * OCEAN_PALETTE.length)
        ];
    
        particles.push({
            r: color[0],
            g: color[1],
            b: color[2],
    
            blink: Math.floor(105 - Math.random() * 6),
            phase: Math.random() * TAU,
    
            x: Math.random() * width,
            y: Math.random() * height,
    
            dx: 0,
            dy: 0
        });
    }
}


// --------------------------------------------------
// GRID
// --------------------------------------------------

function countGridCells() {
    const grid = new Map();

    for (let i = 0; i < nrofParticles; i++) 
    {
        const p = particles[i];

        const gx = Math.floor(p.x / GRID_SIZE);
        const gy = Math.floor(p.y / GRID_SIZE);
        const key = `${gx},${gy}`;

        if (!grid.has(key)) {
            grid.set(key, {
                count: 0,
                r: 0,
                g: 0,
                b: 0
            });
        }

        const cell = grid.get(key);

        cell.count++;
        cell.r += p.r;
        cell.g += p.g;
        cell.b += p.b;
    }

    for (const cell of grid.values()) {
        cell.r /= cell.count;
        cell.g /= cell.count;
        cell.b /= cell.count;
    }

    return grid;
}


// --------------------------------------------------
// PHYSICS
// --------------------------------------------------

function updateParticles() {
    const grid = countGridCells();

    for (let i = 0; i < nrofParticles; i++) {
        const p = particles[i];

        const gx = Math.floor(p.x / GRID_SIZE);
        const gy = Math.floor(p.y / GRID_SIZE);
        const key = `${gx},${gy}`;

        const n = grid.get(key)?.count || 0;
        const phase = n + i * p.blink * INDEX_INFLUENCE;

        p.dx += Math.sin(-1+phase) * FORCE;
        p.dy += Math.cos(-1+phase) * FORCE;

        const speed = Math.hypot(p.dx, p.dy);
        const frictionSteps = Math.floor(speed);

        for (let j = 0; j < frictionSteps; j++) {
            p.dx *= FRICTION;
            p.dy *= FRICTION;
        }

        p.x += p.dx;
        p.y += p.dy;

        // Wrap around screen edges.
        if (p.x < 0) p.x += width;
        if (p.x >= width) p.x -= width;
        if (p.y < 0) p.y += height;
        if (p.y >= height) p.y -= height;
    }
}


// --------------------------------------------------
// AUDIO HELPERS
// --------------------------------------------------

// Match the blink timing used by the visual particles.
// blinkSpeed is in radians per millisecond.
function getBlinkSpeed(p) {
    return 0.001 + (255 - p.blink) * 0.000025;
}

function getBlink(time, p) {
    return 0.5 + 0.5 * Math.sin(
        time * getBlinkSpeed(p) + p.phase
    );
}

function randomPentatonicNote(previousNote) {
    let note;

    do {
        note = PENTATONIC[
            Math.floor(Math.random() * PENTATONIC.length)
        ];
    } while (note === previousNote);

    return note;
}

function randomBlinkCount() {
    // Random integer: 6, 7, 8 or 9 cycles.
    return 6 + Math.floor(Math.random() * 3);
}

function randomBeatOffset() {
    return BEAT_MIN + Math.random() * (BEAT_MAX - BEAT_MIN);
}


// --------------------------------------------------
// AUDIO INITIALIZATION
// --------------------------------------------------

async function startAudio() {
    if (audioStarted) return;

    experience_start=performance.now();

    audioButton.disabled = true;
    audioButton.textContent = "Starting audio...";

    try {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
            throw new Error("Web Audio API is not supported.");
        }

        audioContext = new AudioContextClass();

        await audioContext.resume();

        masterGain = audioContext.createGain();
        masterGain.gain.value = 1.0;
        masterGain.connect(audioContext.destination);

        createAudioVoices();

        audioStarted = true;
        audioButton.textContent = "♪ Audio enabled";
        audioButton.disabled = false;
        audioButton.style.display = "none";

    } catch (error) {
        console.error(error);

        audioButton.disabled = false;
        audioButton.textContent = "♪ Retry audio";
    }
}


// --------------------------------------------------
// CREATE 25 DUAL-OSCILLATOR VOICES
// --------------------------------------------------

function createAudioVoices() {
    audioVoices = [];

    const now = audioContext.currentTime;
    const time = performance.now();

    for (let i = 0; i < AUDIO_VOICE_COUNT; i++) {
        // Use the same blink timing as a real visual particle.
        const p = particles[i];

        const blinkSpeed = getBlinkSpeed(p);
        const blinkFrequency = blinkSpeed * 1000 / TAU;

        const phaseAtStart =
            time * blinkSpeed + p.phase;

        // Random initial pentatonic pitch.
        const baseFrequency = randomPentatonicNote();

        // Slight frequency difference creates acoustic beating.
        const beatOffset = randomBeatOffset();

        // Two tone oscillators.
        const osc1 = audioContext.createOscillator();
        const osc2 = audioContext.createOscillator();

        osc1.type = "sine";
        osc2.type = "sine";

        osc1.frequency.value = baseFrequency;
        osc2.frequency.value = baseFrequency + beatOffset;

        // Balance the two oscillators before the shared envelope.
        const oscGain1 = audioContext.createGain();
        const oscGain2 = audioContext.createGain();

        oscGain1.gain.value = 0.5;
        oscGain2.gain.value = 0.5;

        // Both oscillators share this blinking gain.
        const voiceGain = audioContext.createGain();

        voiceGain.gain.value = AUDIO_VOLUME * 0.525;

        osc1.connect(oscGain1);
        osc2.connect(oscGain2);

        oscGain1.connect(voiceGain);
        oscGain2.connect(voiceGain);

// Stereo position for this voice.
        const panner = audioContext.createStereoPanner();
        panner.pan.value = 2 * (p.x / width) - 1;
        
        voiceGain.connect(panner);
        panner.connect(masterGain);

        // Generate a sine-wave LFO with the same phase as
        // the corresponding visual particle's blink cycle.
        const real = new Float32Array(2);
        const imag = new Float32Array(2);

        real[1] = Math.sin(phaseAtStart);
        imag[1] = Math.cos(phaseAtStart);

        const wave = audioContext.createPeriodicWave(
            real,
            imag,
            { disableNormalization: true }
        );

        const lfo = audioContext.createOscillator();
        const lfoDepth = audioContext.createGain();

        lfo.setPeriodicWave(wave);
        lfo.frequency.value = blinkFrequency;

        // Gain = 0.525 + 0.475 * sin(phase).
        // This matches the visual opacity envelope.
        lfoDepth.gain.value = AUDIO_VOLUME * 0.475;
        lfo.connect(lfoDepth);
        lfoDepth.connect(voiceGain.gain);

        // Track completed blink cycles for pitch changes.
        const initialCycle = Math.floor(phaseAtStart / TAU);

        const voice = {
            particle: p,

            osc1,
            osc2,
            oscGain1,
            oscGain2,

            panner,

            voiceGain,
            lfo,
            lfoDepth,

            baseFrequency,
            beatOffset,

            lastCycle: initialCycle,
            cyclesSinceChange: 0,
            changeEvery: randomBlinkCount(),
            pendingPitchChange: false
        };

        audioVoices.push(voice);

        osc1.start(now);
        osc2.start(now);
        lfo.start(now);
    }
}


// --------------------------------------------------
// AUDIO PITCH UPDATES
// --------------------------------------------------

function updateAudio(time) {
    if (!audioStarted || !audioContext) return;

    const now = audioContext.currentTime;
    
    for (let i = 0; i < audioVoices.length; i++) {
            const voice = audioVoices[i];
    
        // Pan according to the particle's horizontal position.
    // Left edge = -1, center = 0, right edge = +1.
    const pan = 2 * (voice.particle.x / width) - 1;
    
    voice.panner.pan.setTargetAtTime(
        Math.max(-1, Math.min(1, pan)),
        now,
        0.05
    );
    
        voice.voiceGain.gain.setTargetAtTime(
            i < nrofVoices ? AUDIO_VOLUME * 0.525 : 0,
            audioContext.currentTime,
            0.05
        );
    
        const p = voice.particle;

        const blinkSpeed = getBlinkSpeed(p);
        const phase = time * blinkSpeed + p.phase;

        const currentCycle = Math.floor(phase / TAU);
        const completedCycles = currentCycle - voice.lastCycle;

        if (completedCycles > 0) {
            voice.cyclesSinceChange += completedCycles;
            voice.lastCycle = currentCycle;
        }

        // Wait until the selected number of blinks has passed.
        if (voice.cyclesSinceChange >= voice.changeEvery) {
            voice.pendingPitchChange = true;
        }

        // Change pitch only when the voice is near minimum volume.
        const blink = getBlink(time, p);

        if (voice.pendingPitchChange && blink < 0.08) {
            const newFrequency = randomPentatonicNote(
                voice.baseFrequency
            );

            const newOffset = randomBeatOffset();

            // Smooth pitch changes while the sound is quiet.
            voice.osc1.frequency.setTargetAtTime(
                newFrequency,
                now,
                0.025
            );

            voice.osc2.frequency.setTargetAtTime(
                newFrequency + newOffset,
                now,
                0.025
            );

            voice.baseFrequency = newFrequency;
            voice.beatOffset = newOffset;

            voice.cyclesSinceChange = 0;
            voice.changeEvery = randomBlinkCount();
            voice.pendingPitchChange = false;
        }
    }
}


// --------------------------------------------------
// RENDER GRID AND GLOWING PARTICLES
// --------------------------------------------------

function drawGrid(time) {
    ctx.fillStyle = "#080b12";
    ctx.fillRect(0, 0, width, height);

    const grid = countGridCells();

    const cols = Math.ceil(width / GRID_SIZE);
    const rows = Math.ceil(height / GRID_SIZE);

    // Smoothly blend every cell toward its average color.
    for (let gy = 0; gy < rows; gy++) {
        for (let gx = 0; gx < cols; gx++) {
            const key = `${gx},${gy}`;
            const cell = grid.get(key);
            const target = cell || EMPTY_COLOR;

            if (!cellColors.has(key)) {
                cellColors.set(key, { ...target });
            }

            const color = cellColors.get(key);

            color.r += (target.r - color.r) * COLOR_MIX;
            color.g += (target.g - color.g) * COLOR_MIX;
            color.b += (target.b - color.b) * COLOR_MIX;

            ctx.fillStyle = `rgb(
                ${Math.round(color.r / 6)},
                ${Math.round(color.g / 6)},
                ${Math.round(color.b / 6)}
            )`;

            ctx.fillRect(
                gx * GRID_SIZE,
                gy * GRID_SIZE,
                GRID_SIZE,
                GRID_SIZE
            );
        }
    }

    // Draw each particle and its individual glow.
    for (let i = 0; i < nrofParticles; i++) {
         const p = particles[i]; 
        const blink = getBlink(time, p);
        const blinkAlpha = 0.05 + blink * 0.95;

        const r = Math.round(p.r);
        const g = Math.round(p.g);
        const b = Math.round(p.b);

        ctx.fillStyle = `rgba(${r},${g},${b},${blinkAlpha})`;
        ctx.fillRect(p.x - 1, p.y - 1, 3, 3);

        ctx.fillStyle =
            `rgba(${r},${g},${b},${0.2 * blinkAlpha})`;

        ctx.fillRect(p.x - 3, p.y - 5, 7, 9);
        ctx.fillRect(p.x - 5, p.y - 3, 9, 7);

        ctx.fillStyle =
            `rgba(${r},${g},${b},${0.05 * blinkAlpha})`;

        ctx.fillRect(p.x - 10, p.y - 10, 20, 30);
        ctx.fillRect(p.x - 15, p.y - 15, 30, 20);
    }
}


// --------------------------------------------------
// ANIMATION
// --------------------------------------------------

function animate(time) {

    const elapsed = performance.now() - experience_start;
    
    const FADE_IN  = 4 * 60 * 1000;
    const HOLD     = 12 * 60 * 1000;
    const FADE_OUT = 4 * 60 * 1000;
    
    let phase;
    
    if (elapsed < FADE_IN) {
        const t = elapsed / FADE_IN;
        phase = t * t * t;
    } else if (elapsed < FADE_IN + HOLD) {
        phase = 1;
    } else if (elapsed < FADE_IN + HOLD + FADE_OUT) {
        const t = 1 - (elapsed - FADE_IN - HOLD) / FADE_OUT;
        phase = t * t * t;
    } else {
        phase = 0;
    }    
    nrofParticles = Math.ceil(phase*PARTICLE_COUNT);
    nrofVoices = phase > 0
    ? Math.max(1, Math.ceil(25 * phase))
    : 0;

    updateParticles();
    updateAudio(time);
    drawGrid(time);

    requestAnimationFrame(animate);
}


// --------------------------------------------------
// START
// --------------------------------------------------

audioButton.addEventListener("click", startAudio);

window.addEventListener("resize", resizeCanvas);

resizeCanvas();
createParticles();
animate(performance.now());
</script>
</body>
</html>
