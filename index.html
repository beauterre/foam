
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Color Grid</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080b12;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const PARTICLE_COUNT = 8000;
const GRID_SIZE = 70;
const FORCE = 0.07;
const FRICTION = 0.97;
const INDEX_INFLUENCE = 0.00000001;

const COLOR_MIX = 0.02;
const EMPTY_COLOR = { r: 8, g: 11, b: 18 };

let cellColors = new Map();

let width = 0;
let height = 0;
let particles = [];

// Resize canvas to fill the browser window.
function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// Create particles with random colors, blink frequencies and phases.
function createParticles() {
    particles = [];

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        const bright = Math.random() > 0.3;

        particles.push({
            r: bright ? 255 - Math.random() * 164 : Math.random() * 164,
            g: bright ? 255 - Math.random() * 166 : Math.random() * 164,
            b: bright ? 255 - Math.random() * 164 : Math.random() * 164,

            blink: Math.floor(105 - Math.random() * 6),
            phase: Math.random() * Math.PI * 2,

            x: Math.random() * width,
            y: Math.random() * height,

            dx: 0,
            dy: 0
        });
    }
}

// Count particles and calculate the average color in each occupied cell.
function countGridCells() {
    const grid = new Map();

    for (const p of particles) {
        const gx = Math.floor(p.x / GRID_SIZE);
        const gy = Math.floor(p.y / GRID_SIZE);
        const key = `${gx},${gy}`;

        if (!grid.has(key)) {
            grid.set(key, {
                count: 0,
                r: 0,
                g: 0,
                b: 0
            });
        }

        const cell = grid.get(key);

        cell.count++;
        cell.r += p.r;
        cell.g += p.g;
        cell.b += p.b;
    }

    for (const cell of grid.values()) {
        cell.r /= cell.count;
        cell.g /= cell.count;
        cell.b /= cell.count;
    }

    return grid;
}

// Apply forces, friction and movement.
function updateParticles() {
    const grid = countGridCells();

    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        const gx = Math.floor(p.x / GRID_SIZE);
        const gy = Math.floor(p.y / GRID_SIZE);
        const key = `${gx},${gy}`;

        const n = grid.get(key)?.count || 0;
        const phase = n + i * p.blink * INDEX_INFLUENCE;

        p.dx += Math.sin(phase) * FORCE;
        p.dy += Math.cos(phase) * FORCE;

        const speed = Math.hypot(p.dx, p.dy);
        const frictionSteps = Math.floor(speed);

        for (let j = 0; j < frictionSteps; j++) {
            p.dx *= FRICTION;
            p.dy *= FRICTION;
        }

        p.x += p.dx;
        p.y += p.dy;

        // Wrap particles around the edges.
        if (p.x < 0) p.x += width;
        if (p.x >= width) p.x -= width;
        if (p.y < 0) p.y += height;
        if (p.y >= height) p.y -= height;
    }
}

// Render smoothly blending grid cells and individually blinking particles.
function drawGrid(time) {
    ctx.fillStyle = "#080b12";
    ctx.fillRect(0, 0, width, height);

    const grid = countGridCells();

    const cols = Math.ceil(width / GRID_SIZE);
    const rows = Math.ceil(height / GRID_SIZE);

    // Smoothly blend every grid cell toward its current average color.
    for (let gy = 0; gy < rows; gy++) {
        for (let gx = 0; gx < cols; gx++) {
            const key = `${gx},${gy}`;
            const cell = grid.get(key);

            const target = cell
                ? cell
                : EMPTY_COLOR;

            if (!cellColors.has(key)) {
                cellColors.set(key, { ...target });
            }

            const color = cellColors.get(key);

            color.r += (target.r - color.r) * COLOR_MIX;
            color.g += (target.g - color.g) * COLOR_MIX;
            color.b += (target.b - color.b) * COLOR_MIX;

            ctx.fillStyle = `rgb(
                ${Math.round(color.r / 6)},
                ${Math.round(color.g / 6)},
                ${Math.round(color.b / 6)}
            )`;

            ctx.fillRect(
                gx * GRID_SIZE,
                gy * GRID_SIZE,
                GRID_SIZE,
                GRID_SIZE
            );
        }
    }

    // Draw particles with smooth, independent blinking.
    for (const p of particles) {
        const blinkSpeed = 0.001 + (255 - p.blink) * 0.000025;

        const blink = 0.5+ 0.5 * Math.sin(
            time * blinkSpeed + p.phase
        );

        // Never fully switch off.
        const blinkAlpha = 0.05 + blink * 0.95;

        const r = Math.round(p.r);
        const g = Math.round(p.g);
        const b = Math.round(p.b);

        // Bright central particle.
        ctx.fillStyle = `rgba(${r},${g},${b},${blinkAlpha})`;
        ctx.fillRect(p.x - 1, p.y - 1, 3, 3);

        // Mid-range glow.
        ctx.fillStyle = `rgba(${r},${g},${b},${0.2 * blinkAlpha})`;
        ctx.fillRect(p.x - 3, p.y - 5, 7, 9);
        ctx.fillRect(p.x - 5, p.y - 3, 9, 7);

        // Broad, subtle glow.
        ctx.fillStyle = `rgba(${r},${g},${b},${0.05 * blinkAlpha})`;
        ctx.fillRect(p.x - 10, p.y - 10, 20, 30);
        ctx.fillRect(p.x - 15, p.y - 15, 30, 20);
    }
}

// Main animation loop.
function animate(time) {
    updateParticles();
    drawGrid(time);

    requestAnimationFrame(animate);
}

// Start.
window.addEventListener("resize", resizeCanvas);

resizeCanvas();
createParticles();
animate();
</script>
</body>
</html>
